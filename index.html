<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenBookMap</title>
    <meta
      name="description"
      content="A global map of used bookstores, with searchable inventories built from shelf photos."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&display=swap"
      rel="stylesheet"
    />
    <style>
      .splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        padding: 24px;
      }
      .splash h1 {
        font-family: var(--font-serif);
        font-size: clamp(36px, 6vw, 56px);
        font-weight: 800;
        font-style: italic;
        letter-spacing: -0.02em;
      }
      .splash .subtitle {
        font-family: var(--font-mono);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .splash #status {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--ink-soft);
        letter-spacing: 0.05em;
      }
      .splash .links {
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.1em;
      }
      .splash .links a {
        color: var(--ink-soft);
        text-decoration: underline;
        text-underline-offset: 3px;
        margin: 0 8px;
      }
      .splash .links a:hover {
        color: var(--stamp);
      }
    </style>
  </head>
  <body>
    <main class="splash">
      <div class="subtitle">A global map of used bookstores, one day books, then imagine words...</div>
      <h1>OpenBookMap</h1>
      <div id="status">Loading map…</div>
      <div class="links">
        <a href="./map.html">Open the map →</a>
        <a href="./about.html">About</a>
      </div>
    </main>
    <script type="module" src="/src/pages/landing.js"></script>
  </body>
</html>
