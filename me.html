<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Me — OpenBookMap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800&display=swap"
      rel="stylesheet"
    />
    <style>
      .page-wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: calc(var(--topbar-height) + 28px) 24px 40px;
      }
      .page-wrap .card {
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <header data-topbar>
      <!-- Static fallback nav so the topbar shows even if JS fails to mount it. -->
      <a
        href="./"
        style="
          font-style: italic;
          font-weight: 800;
          font-size: 22px;
          text-decoration: none;
          color: #1a1613;
        "
      >
        OpenBookMap<span style="color: #a8321c">.</span>
      </a>
      <nav
        style="
          font-family: 'DM Mono', monospace;
          font-size: 12px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        "
      >
        <a href="./map.html" style="color: #3a332c; text-decoration: none; padding: 6px 10px"
          >Map</a
        >
        <a href="./search.html" style="color: #3a332c; text-decoration: none; padding: 6px 10px"
          >Search</a
        >
        <a
          href="./contribute.html"
          style="
            background: #1a1613;
            color: #f4ecd8;
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 2px;
          "
          >Contribute</a
        >
      </nav>
    </header>
    <div class="page-wrap" id="me-root">
      <!-- Static fallback so the page is never blank. JS overwrites this
           once Supabase resolves; if JS throws, the user still sees this. -->
      <div
        style="
          background: #fbf5e4;
          border: 1px solid #1a16131a;
          padding: 22px;
          border-radius: 2px;
          margin-top: 80px;
        "
      >
        <h2 style="font-size: 22px; font-weight: 600; margin-bottom: 10px">
          Loading your contributions…
        </h2>
        <p style="color: #3a332c; font-size: 14px">
          If this message stays, JavaScript may have failed to load or your browser is blocking it.
          Try the
          <a href="./map.html" style="color: #1a1613">map</a> directly, or
          <a href="./contribute.html" style="color: #1a1613">sign in</a> from the contribute page.
        </p>
      </div>
    </div>
    <footer data-footer></footer>
    <script type="module" src="/src/pages/me.js"></script>
  </body>
</html>
